version: '3.8'

services:
  cereal-bot:
    build: .
    container_name: cereal-bot
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cereal.db:/app/cereal.db
    restart: unless-stopped
    healthcheck:
      # curl isn't installed in the slim image — use Python's stdlib instead.
      # The health server binds to 127.0.0.1, so this only works in-container.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # The health endpoint is loopback-only inside the container. To expose it
    # for external uptime monitoring, set HEALTH_HOST=0.0.0.0 in .env and
    # uncomment the mapping below.
    # ports:
    #   - "8080:8080"
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge